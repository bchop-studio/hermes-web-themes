name: Validate theme pack

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out web themes
        uses: actions/checkout@v4

      - name: Check out source skins
        uses: actions/checkout@v4
        with:
          repository: bchop-studio/hermes-skins-pack
          ref: d626c02a484d3122a2aa71b675f06c12f81ee904
          path: hermes-skins-pack

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Place source beside web themes
        run: mv hermes-skins-pack ../hermes-skins-pack

      - name: Validate schemas
        run: python scripts/validate.py

      - name: Test source parity and deterministic conversion
        run: python -m unittest discover -s tests -v
