  primaryForeground: '#ffffff'
  accent: '#ff5ca8'
  accentForeground: '#ffffff'
  border: '#1e3038'
  input: '#1e3038'
  ring: '#ff5ca8'
  success: '#58e0a8'
  warning: '#f0c058'
  destructive: '#ff6060'
