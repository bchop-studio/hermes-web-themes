# Ported from bchop-studio/hermes-skins-pack (skins/terminal-bloom.yaml)
name: terminal-bloom
label: Terminal Bloom
description: Overgrown console dark — frost text, hot-orchid accents, and teal tooling
palette:
  background:
    hex: '#0c1014'
    alpha: 1.0
  midground:
    hex: '#d0e4f0'
    alpha: 1.0
  foreground:
    hex: '#ffffff'
    alpha: 0.0
  warmGlow: rgba(255, 92, 168, 0.35)
