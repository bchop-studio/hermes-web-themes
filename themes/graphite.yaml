# Ported from bchop-studio/hermes-skins-pack (skins/graphite.yaml)
name: graphite
label: Graphite
description: Dark pencil-lead tones — warm graphite grays with subtle blue-green accent,
  no harsh contrast
palette:
  background:
    hex: '#1e1e1e'
    alpha: 1.0
  midground:
    hex: '#c8c8c8'
    alpha: 1.0
  foreground:
    hex: '#ffffff'
    alpha: 0.0
  warmGlow: rgba(96, 128, 128, 0.35)
  noiseOpacity: 0.6
colorOverrides:
  primary: '#608080'
  primaryForeground: '#ffffff'
  accent: '#608080'
  accentForeground: '#ffffff'
  border: '#4a4a4a'
  input: '#4a4a4a'
  ring: '#608080'
  success: '#608860'
  warning: '#888060'
  destructive: '#886060'
