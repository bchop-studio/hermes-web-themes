# Ported from bchop-studio/hermes-skins-pack (skins/amber-terminal.yaml)
name: amber-terminal
label: Amber Terminal
description: Classic CRT phosphor — warm amber text on a deep burnt-black tube with
  scanline vibes
palette:
  background:
    hex: '#0c0804'
    alpha: 1.0
  midground:
    hex: '#e0c088'
    alpha: 1.0
  foreground:
    hex: '#ffffff'
    alpha: 0.0
  warmGlow: rgba(200, 144, 48, 0.35)
  noiseOpacity: 0.6
colorOverrides:
  primary: '#c89030'
  primaryForeground: '#ffffff'
  accent: '#c89030'
  accentForeground: '#ffffff'
  border: '#b08020'
  input: '#b08020'
  ring: '#c89030'
  success: '#c0b040'
  warning: '#e0b040'
  destructive: '#e05030'
