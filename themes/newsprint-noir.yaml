  primaryForeground: '#ffffff'
  accent: '#787890'
  accentForeground: '#ffffff'
  border: '#505870'
  input: '#505870'
  ring: '#787890'
  success: '#60a070'
  warning: '#c0a860'
  destructive: '#b05850'
